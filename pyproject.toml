[project]
name = "ent-llm"
version = "0.1.0"
description = "LLM evaluation of ENT clinical cases"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "google-cloud-bigquery>=3.10.0",
    "db-dtypes>=1.1.0",
    "google-cloud-aiplatform>=1.25.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "reportlab>=4.0.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "securellm @ git+ssh://git@github.com/VISTA-Stanford/secure-llm.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]

[project.scripts]
ent-llm = "cli:main"
ent-llm-extract = "cli_extract:main"
ent-llm-ablation = "cli_ablation:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["batch_query*", "data_extraction*", "evaluation*", "llm_query*", "training*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]
